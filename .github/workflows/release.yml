name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Native Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore / Cache vcpkg OpenSSL
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: C:/vcpkg/installed
          key: ${{ runner.os }}-vcpkg-openssl-x64-windows-static-v2

      - name: Install static OpenSSL via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "[*] Installing OpenSSL:x64-windows-static via vcpkg..."
          cd C:\vcpkg
          .\vcpkg.exe install openssl:x64-windows-static

      - name: Configure CMake with MSVC & static vcpkg
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Compile Slug Release Executable
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath "compile_output.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "================ COMPILATION ERROR LOG ================"
            Get-Content "compile_output.log" | Select-String "error|fatal|fail" -Context 2,2 | Select-Object -First 50
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-logs
            git add compile_output.log
            git commit -m "chore: record build error"
            git push origin build-logs --force
            exit 1
          }

      - name: Verify Compiled Windows Binary
        shell: pwsh
        run: |
          $exe = $null
          $candidates = @("build/Release/slug.exe", "build/slug.exe", "bin/slug.exe")
          foreach ($c in $candidates) {
            if (Test-Path $c) { $exe = $c; break }
          }
          if (-not $exe) {
            Write-Error "slug.exe binary was not produced!"
            exit 1
          }
          Write-Host "[+] Found compiled binary at: $exe"
          & $exe version

      - name: Package Windows Release Distribution
        shell: pwsh
        run: |
          .\scripts\package_windows.ps1 -Version "1.0.0" -Arch "x86_64"

      - name: Upload Windows Assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $TargetTag = "${{ github.event.inputs.tag }}"
          if (-not $TargetTag) {
            if ("${{ github.ref_name }}".StartsWith("v")) {
              $TargetTag = "${{ github.ref_name }}"
            } else {
              $TargetTag = "v1.0.0"
            }
          }
          Write-Host "[*] Target GitHub release tag: $TargetTag"

          # Attempt to merge existing SHA256SUMS from GitHub release
          try {
            gh release download $TargetTag -p "SHA256SUMS" --clobber
            if (Test-Path "SHA256SUMS") {
              $existing = Get-Content "SHA256SUMS"
              $winHashes = Get-Content "dist/SHA256SUMS.windows"
              $merged = @($existing; $winHashes) | Where-Object { $_.Trim() -ne "" } | Select-Object -Unique
              $merged | Set-Content "dist/SHA256SUMS" -Encoding utf8
            }
          } catch {
            Write-Host "[-] Note: Could not download or merge existing SHA256SUMS: $($_.Exception.Message)"
          }

          # Check if release exists; create or upload
          $releaseExists = $false
          try {
            gh release view $TargetTag
            $releaseExists = $true
          } catch {
            Write-Host "[*] Release $TargetTag does not exist yet. It will be created."
          }

          $uploadAssets = @(
            "dist/slug-1.0.0-windows-x86_64.zip",
            "dist/slug-1.0.0-windows-x64.zip",
            "dist/slug-windows-x86_64.exe",
            "dist/slug.exe",
            "dist/install.ps1",
            "dist/slug-icon.ico",
            "dist/SHA256SUMS.windows"
          )
          if (Test-Path "dist/SHA256SUMS") {
            $uploadAssets += "dist/SHA256SUMS"
          }

          if ($releaseExists) {
            Write-Host "[*] Uploading assets to existing release $TargetTag..."
            gh release upload $TargetTag @uploadAssets --clobber
          } else {
            Write-Host "[*] Creating new release $TargetTag..."
            gh release create $TargetTag @uploadAssets --title "Slug $TargetTag" --generate-notes
          }

          Write-Host "[+] All Windows release assets uploaded successfully to $TargetTag!"
          try {
            git push origin --delete build-logs
          } catch {}

  build-linux:
    name: Build Linux x64 Native Static Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies & OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libzstd-dev zlib1g-dev pkg-config

      - name: Compile Slug Static Binary
        run: |
          set -o pipefail
          make static -j$(nproc) 2>&1 | tee linux_compile.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "================ LINUX COMPILATION ERROR LOG ================"
            cat linux_compile.log
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-logs-linux
            git add linux_compile.log
            git commit -m "chore: record linux build error"
            git push origin build-logs-linux --force
            exit 2
          fi

      - name: Verify Compiled Linux Binary
        run: |
          ./bin/slug-static version

      - name: Package Linux Tarball and Debian Package
        run: |
          chmod +x scripts/package_linux.sh scripts/package_deb.sh scripts/install.sh
          ./scripts/package_linux.sh
          ./scripts/package_deb.sh

      - name: Upload Linux Assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TargetTag="${{ github.event.inputs.tag }}"
          if [ -z "$TargetTag" ]; then
            if [[ "${{ github.ref_name }}" == v* ]]; then
              TargetTag="${{ github.ref_name }}"
            else
              TargetTag="v1.0.0"
            fi
          fi
          echo "[*] Target GitHub release tag: $TargetTag"

          upload_assets=()
          for f in dist/slug-1.0.0-linux-x86_64.tar.gz dist/slug_1.0.0_amd64.deb dist/slug-linux-x86_64 dist/install.sh dist/SHA256SUMS.linux; do
            if [ -f "$f" ]; then
              upload_assets+=("$f")
            fi
          done

          # Download and merge existing SHA256SUMS from GitHub release if present
          if gh release download "$TargetTag" -p "SHA256SUMS" --clobber 2>/dev/null; then
            if [ -f "dist/SHA256SUMS.linux" ]; then
              cat "dist/SHA256SUMS.linux" >> "SHA256SUMS"
              sort -u "SHA256SUMS" -o "dist/SHA256SUMS"
              upload_assets+=("dist/SHA256SUMS")
            fi
          elif [ -f "dist/SHA256SUMS.linux" ]; then
            cp "dist/SHA256SUMS.linux" "dist/SHA256SUMS"
            upload_assets+=("dist/SHA256SUMS")
          fi

          if gh release view "$TargetTag" >/dev/null 2>&1; then
            echo "[*] Uploading Linux assets to existing release $TargetTag..."
            gh release upload "$TargetTag" "${upload_assets[@]}" --clobber
          else
            echo "[*] Creating release $TargetTag and uploading Linux assets..."
            gh release create "$TargetTag" "${upload_assets[@]}" --title "Slug $TargetTag" --generate-notes
          fi

          echo "[+] All Linux release assets uploaded successfully to $TargetTag!"
          git push origin --delete build-logs-linux 2>/dev/null || true

