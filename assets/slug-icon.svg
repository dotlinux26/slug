<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Quantum Cyan to Emerald Gradient -->
    <linearGradient id="slugIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="45%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>

    <!-- Embedded JetBrains Mono font -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&amp;display=swap');
      .jb-icon {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, Menlo, Monaco, monospace;
        font-weight: 800;
        font-size: 154px;
        letter-spacing: -3px;
      }
    </style>
  </defs>

  <!-- Transparent Background - Pure Text: slug in JetBrains Mono -->
  <text x="50%" y="300" text-anchor="middle"
        class="jb-icon"
        fill="url(#slugIconGrad)">slug</text>
</svg>
